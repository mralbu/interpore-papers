# The InterPore annual meetings (International Conference on Porous Media &
# Annual Meeting of the International Society for Porous Media).
#
# Hand-curated facts, one entry per meeting, used by the pipeline (which
# meetings have abstracts and where they come from) and by the History view.
# Sources: https://www.interpore.org/interpore-events-past-upcoming (dates,
# places, numbering), the per-meeting pages on interpore.org (node/887-894,
# node/976, event/interpore2025, event/ip2027) and the Indico event pages
# (https://events.interpore.org/event/<indico>/).
#
# Fields:
#   number, year, title, start, end, city, country, venue, format
#   (in-person | online | hybrid)
#   indico: event id on events.interpore.org (abstracts come from its JSON export)
#   book: book of abstracts PDF (2016 and 2017 abstracts are parsed from it)
#   program: conference program PDF, report: post-conference report PDF
#   page: the meeting's page on interpore.org
#   notes: one or two sentences for the timeline, from the sources above

society:
  name: International Society for Porous Media (InterPore)
  founded: 2008
  seat: De Bilt, The Netherlands
  about: >-
    A non-profit, independent scientific organisation established in 2008 to
    advance and disseminate knowledge for the understanding, description and
    modelling of natural and industrial porous media systems: soils, aquifers,
    oil and gas reservoirs, biological tissues and plants, but also fuel cells,
    concrete, textiles, polymer composites and in-tissue drug delivery.
  url: https://www.interpore.org/about-interpore
  issn: 2518-3826 (books of abstracts, electronic)

